name: CFAssistant
options:
  bundleIdPrefix: com.cfassistant
  deploymentTarget:
    iOS: "16.0"
targets:
  CFAssistant:
    type: application
    platform: iOS
    sources:
      - path: .
        includes: ["*.swift"]
        excludes: ["PacketTunnelProvider.swift", "CFControl/**"]
      - path: Assets.xcassets
    entitlements:
      path: CFAssistant.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - target: CFTunnel
        embed: true
    info:
      path: CFAssistant-Info.plist
      properties:
        NSLocalNetworkUsageDescription: "连接诊断会测试您输入的局域网 IP 和端口，仅用于测量 TCP 连通性。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cfassistant.ios
        PRODUCT_NAME: CFAssistant
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: VPN_BUILD
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "CF助手"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  CFTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: .
        includes: ["PacketTunnelProvider.swift"]
    entitlements:
      path: CFTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    dependencies:
      - framework: Libbox.xcframework
        embed: false
    info:
      path: CFTunnel-Info.plist
      properties:
        CFBundleDisplayName: CF助手 VPN
        NSLocalNetworkUsageDescription: "连接诊断会测试您输入的局域网 IP 和端口，仅用于测量 TCP 连通性。"
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cfassistant.ios.tunnel
        PRODUCT_NAME: CFTunnel
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: ["-lresolv"]
        SKIP_INSTALL: YES
  ConfigParityTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CFAssistant
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cfassistant.ios.configtests
        SWIFT_VERSION: "5.9"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: VPN_BUILD
schemes:
  CFAssistant:
    build:
      targets:
        CFAssistant: all
        CFTunnel: all
    test:
      targets:
        - ConfigParityTests

name: CFAssistant
options:
  bundleIdPrefix: com.cfassistant
  deploymentTarget:
    iOS: "16.0"
targets:
  CFAssistant:
    type: application
    platform: iOS
    sources:
      - path: .
        includes: ["*.swift"]
        excludes: ["PacketTunnelProvider.swift"]
      - path: Assets.xcassets
    info:
      path: CFAssistant-Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cfassistant.ios
        PRODUCT_NAME: CFAssistant
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "CF助手"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "连接诊断会测试您输入的局域网 IP 和端口，仅用于测量 TCP 连通性。"
schemes:
  CFAssistant:
    build:
      targets:
        CFAssistant: all

name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Install XcodeGen (因为您有 项目.yml)
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build and Archive
      run: |
        # 注意：这里的 CFAssistant 需要替换为您 XcodeGen 生成的项目名称（可以在 项目.yml 里的 name 字段找到）
        xcodebuild archive -project CFAssistant.xcodeproj -scheme CFAssistant -sdk iphoneos -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    - name: Package into IPA
      run: |
        mkdir Payload
        cp -r build/App.xcarchive/Products/Applications/*.app Payload/
        zip -r App.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: App-IPA
        path: App.ipa 

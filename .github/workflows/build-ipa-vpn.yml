name: Build IPA with VPN

on:
  push:
    branches: [ main, 'cursor/**' ]
  workflow_dispatch:

concurrency:
  group: ipa-vpn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Libbox (sing-box 1.11 series)
        run: |
          TAG=$(git ls-remote --tags --refs https://github.com/SagerNet/sing-box.git 'refs/tags/v1.11.*' | awk -F/ '{print $3}' | grep -E '^v1\.11\.[0-9]+$' | sort -V | tail -1)
          echo "sing-box tag: $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box"
          cd "$RUNNER_TEMP/sing-box"
          GM=$(grep 'sagernet/gomobile' go.mod | head -1 | awk '{print $2}')
          GM=${GM:-v0.1.4}
          echo "gomobile: $GM"
          go install -v github.com/sagernet/gomobile/cmd/gomobile@$GM
          go install -v github.com/sagernet/gomobile/cmd/gobind@$GM
          export PATH="$PATH:$(go env GOPATH)/bin"
          (go run ./cmd/internal/build_libbox -target apple -platform ios || go run ./cmd/internal/build_libbox -target apple)
          ls -d Libbox.xcframework
          mv Libbox.xcframework "$GITHUB_WORKSPACE/"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project-vpn.yml

      - name: Validate generated sing-box DNS configuration
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/main.swift" <<'SWIFT'
          import Foundation
          let node = ProxyNode(name: "config-check", proto: "ss", server: "192.0.2.1", port: 443,
                               secret: "test-only", params: ["method": "aes-128-gcm"])
          let text = SingBoxConfig.build(nodes: [node], selectedID: node.id, mode: .manual,
                                         bypassCN: true, rules: [])
          let root = try JSONSerialization.jsonObject(with: Data(text.utf8)) as! [String: Any]
          let dns = root["dns"] as! [String: Any]
          let servers = dns["servers"] as! [[String: Any]]
          precondition(dns["final"] as? String == "dns-local")
          precondition(servers.contains { $0["tag"] as? String == "dns-local" && $0["address"] as? String == "https://1.1.1.1/dns-query" && $0["detour"] as? String == "direct" })
          precondition(servers.contains { $0["tag"] as? String == "dns-remote" && $0["detour"] as? String == "proxy" })
          let route = root["route"] as! [String: Any]
          let rules = route["rules"] as! [[String: Any]]
          precondition(route["final"] as? String == "proxy")
          let hijack = rules.firstIndex { $0["action"] as? String == "hijack-dns" && $0["port"] as? Int == 53 }!
          let privateRoute = rules.firstIndex { $0["ip_is_private"] as? Bool == true }!
          precondition(hijack < privateRoute)
          precondition(!rules.contains { ($0["ip_cidr"] as? [String])?.contains("1.1.1.1/32") == true && $0["outbound"] as? String == "direct" })
          let tun = (root["inbounds"] as! [[String: Any]])[0]
          let excludes = tun["inet4_route_exclude_address"] as! [String]
          precondition(excludes.contains("192.0.2.1/32") && !excludes.contains("1.1.1.1/32"))
          let outbounds = root["outbounds"] as! [[String: Any]]
          precondition(outbounds.contains { $0["type"] as? String == "shadowsocks" && $0["server"] as? String == node.server && $0["server_port"] as? Int == node.port && $0["password"] as? String == node.secret })
          FileHandle.standardOutput.write(Data(text.utf8))
          SWIFT
          swiftc ProxyNodes.swift SingBoxConfig.swift "$RUNNER_TEMP/main.swift" -o "$RUNNER_TEMP/config-check"
          "$RUNNER_TEMP/config-check" > "$RUNNER_TEMP/sing-box-dns-check.json"
          cd "$RUNNER_TEMP/sing-box"
          go run -tags with_clash_api ./cmd/sing-box check -c "$RUNNER_TEMP/sing-box-dns-check.json"

      - name: Build and Archive
        run: |
          xcodebuild archive -project CFAssistant.xcodeproj -scheme CFAssistant -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Embed entitlements (ad-hoc, re-signer keeps them)
        run: |
          APP=$(ls -d build/App.xcarchive/Products/Applications/*.app)
          codesign -f -s - --entitlements CFTunnel.entitlements "$APP/PlugIns/CFTunnel.appex"
          if [ -d "$APP/PlugIns/CFControl.appex" ]; then
            codesign -f -s - --entitlements CFControl.entitlements "$APP/PlugIns/CFControl.appex"
          fi
          codesign -f -s - --entitlements CFAssistant.entitlements "$APP"

      - name: Package into IPA
        run: |
          mkdir Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qry CFAssistant-VPN.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CFAssistant-VPN-IPA
          path: CFAssistant-VPN.ipa

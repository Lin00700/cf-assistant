name: Build Legacy sing-box 1.11.15 Test IPA
on:
  push:
    branches: [test/legacy-singbox-1.11]
  workflow_dispatch:
concurrency:
  group: legacy-singbox-1.11-ipa
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/cache/restore@v4
        id: libbox-cache
        with:
          path: Libbox.xcframework
          key: libbox-sagernet-v1.11.15-bc35aca-ios-clash-v1
      - name: Build Libbox (official sing-box v1.11.15)
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          REF=v1.11.15
          COMMIT=bc35aca01704497c179da1a03e45ad8e32f1a51b
          SRC="$RUNNER_TEMP/sing-box-legacy"
          git clone --depth 1 --branch "$REF" https://github.com/SagerNet/sing-box.git "$SRC"
          cd "$SRC"
          git checkout --detach "$COMMIT"
          test "$(git rev-parse HEAD)" = "$COMMIT"
          GM=v0.1.4
          go install -v "github.com/sagernet/gomobile/cmd/gomobile@$GM"
          go install -v "github.com/sagernet/gomobile/cmd/gobind@$GM"
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target apple -platform ios
          test -d Libbox.xcframework
          mv Libbox.xcframework "$GITHUB_WORKSPACE/"
      - uses: actions/cache/save@v4
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        with:
          path: Libbox.xcframework
          key: libbox-sagernet-v1.11.15-bc35aca-ios-clash-v1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project-vpn.yml
      - name: Validate legacy config and XHTTP import behavior
        run: |
          set -euo pipefail
          cp Scripts/SingBoxLegacyConfigCheck.swift "$RUNNER_TEMP/main.swift"
          swiftc ProxyNodes.swift SingBoxConfig.swift "$RUNNER_TEMP/main.swift" -o "$RUNNER_TEMP/legacy-config-check"
          "$RUNNER_TEMP/legacy-config-check" > "$RUNNER_TEMP/sing-box-1.11-check.json"
          SRC="$RUNNER_TEMP/sing-box-legacy"
          if [ ! -d "$SRC/.git" ]; then
            git clone --depth 1 --branch v1.11.15 https://github.com/SagerNet/sing-box.git "$SRC"
          fi
          cd "$SRC"
          git checkout --detach bc35aca01704497c179da1a03e45ad8e32f1a51b
          test "$(git rev-parse HEAD)" = bc35aca01704497c179da1a03e45ad8e32f1a51b
          go run -tags with_clash_api ./cmd/sing-box check -c "$RUNNER_TEMP/sing-box-1.11-check.json"
      - name: Build and Archive
        run: xcodebuild archive -project CFAssistant.xcodeproj -scheme CFAssistant -sdk iphoneos -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Embed entitlements (ad-hoc, re-signer keeps them)
        run: |
          APP=$(ls -d build/App.xcarchive/Products/Applications/*.app)
          codesign -f -s - --entitlements CFTunnel.entitlements "$APP/PlugIns/CFTunnel.appex"
          if [ -d "$APP/PlugIns/CFControl.appex" ]; then
            codesign -f -s - --entitlements CFControl.entitlements "$APP/PlugIns/CFControl.appex"
          fi
          codesign -f -s - --entitlements CFAssistant.entitlements "$APP"
      - name: Package into IPA
        run: |
          mkdir Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qry CFAssistant-SingBox-1.11.15-Legacy-Test.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CFAssistant-SingBox-1.11.15-Legacy-Test
          path: CFAssistant-SingBox-1.11.15-Legacy-Test.ipa
